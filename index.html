<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Battle</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #010108;
  font-family: Arial, sans-serif;
  color: white;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: #02020c;
}

#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 5;
}

.box {
  background: rgba(3, 5, 20, .82);
  border: 1px solid #394c91;
  border-radius: 12px;
  padding: 10px 15px;
  min-width: 175px;
  box-shadow: 0 0 15px rgba(50,80,255,.15);
}

.label {
  font-size: 12px;
  color: #aeb9e8;
}

.value {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 6px;
}

.bar {
  width: 150px;
  height: 8px;
  background: #171827;
  border-radius: 10px;
  overflow: hidden;
  margin: 3px 0 8px;
}

#health {
  height: 100%;
  width: 100%;
  background: #ff315c;
}

#shield {
  height: 100%;
  width: 100%;
  background: #32aaff;
}

#screen {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
  background: rgba(0,0,10,.35);
}

.card {
  text-align: center;
  padding: 35px;
  border-radius: 20px;
  background: rgba(3,5,20,.94);
  border: 1px solid #455db0;
  box-shadow: 0 0 50px rgba(50,70,255,.3);
}

h1 {
  margin: 0 0 12px;
  font-size: 48px;
  letter-spacing: 5px;
}

.card p {
  color: #cbd3ff;
  margin: 8px;
}

button {
  margin-top: 18px;
  padding: 13px 28px;
  border: 0;
  border-radius: 10px;
  background: #426aff;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #6485ff;
}

.hidden {
  display: none !important;
}

#controls {
  position: absolute;
  bottom: 12px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #8995c5;
  font-size: 13px;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

  <div class="box">
    <div class="label">LEVEL</div>
    <div class="value" id="level">1</div>

    <div class="label">ENEMIES</div>
    <div class="value" id="enemyCount">0</div>

    <div class="label">SCORE</div>
    <div class="value" id="score">0</div>
  </div>

  <div class="box">

    <div class="label">HULL</div>

    <div class="bar">
      <div id="health"></div>
    </div>

    <div class="label">SHIELD</div>

    <div class="bar">
      <div id="shield"></div>
    </div>

  </div>

</div>

<div id="screen">

  <div class="card" id="card">

    <h1>SPACE BATTLE</h1>

    <p>Destroy all enemy energy ships.</p>
    <p><b>A / D</b> or <b>← / →</b> to move</p>
    <p><b>SPACE</b> to fire</p>

    <button id="start">START GAME</button>

  </div>

</div>

<div id="controls">
  A / D or ← / → = Move &nbsp; | &nbsp; SPACE = Shoot
</div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 1200;
let H = 700;

let running = false;
let level = 1;
let score = 0;
let lastTime = 0;

const keys = {};

let enemies = [];
let playerShots = [];
let enemyShots = [];
let particles = [];
let stars = [];

const player = {
  x: 600,
  y: 620,
  speed: 450,
  hp: 100,
  shield: 100,
  cooldown: 0
};


/* =========================
   RESIZE
========================= */

function resize() {

  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;

  player.y = H - 100;

  player.x = Math.max(
    35,
    Math.min(W - 35, player.x)
  );
}

window.addEventListener("resize", resize);


/* =========================
   STARS
========================= */

function createStars() {

  stars = [];

  for (let i = 0; i < 180; i++) {

    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 2 + .3,
      speed: Math.random() * 35 + 10,
      brightness: Math.random()
    });

  }
}


/* =========================
   ENEMIES
========================= */

function createEnemies() {

  enemies = [];

  const count = Math.min(
    4 + level * 2,
    22
  );

  const columns = Math.min(
    6,
    count
  );

  const spacing =
    Math.min(145, W / (columns + 1));

  for (let i = 0; i < count; i++) {

    const column = i % columns;
    const row = Math.floor(i / columns);

    const baseX =
      W / 2 +
      (column - (columns - 1) / 2) *
      spacing;

    const baseY =
      120 + row * 85;

    const hp =
      2 + Math.floor(level / 3);

    enemies.push({

      x: baseX,
      baseX: baseX,

      y: baseY,

      hp: hp,
      maxHp: hp,

      phase:
        Math.random() * Math.PI * 2,

      movementSpeed:
        .7 + Math.random() * .5,

      movementWidth:
        Math.min(
          130 + level * 5,
          W * .2
        ),

      shootTimer:
        Math.random() * 2,

      shootRate:
        Math.max(
          .45,
          1.5 - level * .05
        ),

      rotation:
        Math.random() * Math.PI * 2

    });

  }

}


/* =========================
   START
========================= */

function startGame() {

  resize();

  level = 1;
  score = 0;

  player.hp = 100;
  player.shield = 100;
  player.x = W / 2;

  playerShots = [];
  enemyShots = [];
  particles = [];

  createStars();
  createEnemies();

  document.getElementById(
    "screen"
  ).classList.add("hidden");

  running = true;

  lastTime = performance.now();

  requestAnimationFrame(loop);
}

document.getElementById(
  "start"
).onclick = startGame;


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  e => {

    keys[e.key.toLowerCase()] = true;

    if (e.code === "Space") {
      keys.space = true;
      e.preventDefault();
    }

    if (
      e.key === "ArrowLeft" ||
      e.key === "ArrowRight"
    ) {
      e.preventDefault();
    }

  }
);

window.addEventListener(
  "keyup",
  e => {

    keys[e.key.toLowerCase()] = false;

    if (e.code === "Space") {
      keys.space = false;
    }

  }
);


/* =========================
   PLAYER SHOOT
========================= */

function playerShoot() {

  if (player.cooldown > 0)
    return;

  playerShots.push({

    x: player.x,
    y: player.y - 30,

    speed: 700,

    radius: 4

  });

  player.cooldown = .16;
}


/* =========================
   ENEMY SHOOT
========================= */

function enemyShoot(enemy) {

  enemyShots.push({

    x: enemy.x,
    y: enemy.y + 28,

    speed:
      250 + level * 15,

    radius: 6

  });

}


/* =========================
   PLAYER DAMAGE
========================= */

function hurtPlayer(amount) {

  if (player.shield > 0) {

    const absorbed =
      Math.min(
        player.shield,
        amount
      );

    player.shield -= absorbed;

    amount -= absorbed;
  }

  player.hp -= amount;

  explosion(
    player.x,
    player.y,
    "#38bfff",
    8
  );

  if (player.hp <= 0) {

    player.hp = 0;

    gameOver();

  }
}


/* =========================
   EXPLOSIONS
========================= */

function explosion(
  x,
  y,
  color,
  amount
) {

  for (
    let i = 0;
    i < amount;
    i++
  ) {

    const angle =
      Math.random() *
      Math.PI * 2;

    const speed =
      Math.random() *
      220 + 40;

    particles.push({

      x: x,
      y: y,

      vx:
        Math.cos(angle) *
        speed,

      vy:
        Math.sin(angle) *
        speed,

      life:
        .3 +
        Math.random() *
        .6,

      size:
        Math.random() * 4 + 1,

      color: color

    });

  }
}


/* =========================
   UPDATE
========================= */

function update(dt) {

  /* PLAYER */

  let direction = 0;

  if (
    keys["a"] ||
    keys["arrowleft"]
  ) {
    direction--;
  }

  if (
    keys["d"] ||
    keys["arrowright"]
  ) {
    direction++;
  }

  player.x +=
    direction *
    player.speed *
    dt;

  player.x =
    Math.max(
      35,
      Math.min(
        W - 35,
        player.x
      )
    );

  if (keys.space) {
    playerShoot();
  }

  player.cooldown =
    Math.max(
      0,
      player.cooldown - dt
    );


  /* ENEMIES */

  for (const enemy of enemies) {

    enemy.x =
      enemy.baseX +
      Math.sin(
        performance.now() *
        .001 *
        enemy.movementSpeed +
        enemy.phase
      ) *
      enemy.movementWidth;

    enemy.x =
      Math.max(
        35,
        Math.min(
          W - 35,
          enemy.x
        )
      );

    enemy.shootTimer -= dt;

    if (
      enemy.shootTimer <= 0
    ) {

      enemyShoot(enemy);

      enemy.shootTimer =
        enemy.shootRate +
        Math.random() * .7;

    }

    enemy.rotation += dt;

  }


  /* PLAYER SHOTS */

  for (const shot of playerShots) {

    shot.y -=
      shot.speed * dt;

  }


  /* ENEMY SHOTS */

  for (const shot of enemyShots) {

    shot.y +=
      shot.speed * dt;

  }


  /* PLAYER SHOT COLLISIONS */

  for (const shot of playerShots) {

    for (const enemy of enemies) {

      if (enemy.dead)
        continue;

      const distance =
        Math.hypot(
          shot.x - enemy.x,
          shot.y - enemy.y
        );

      if (distance < 32) {

        shot.dead = true;

        enemy.hp--;

        explosion(
          shot.x,
          shot.y,
          "#ff75a5",
          5
        );

        if (enemy.hp <= 0) {

          enemy.dead = true;

          score +=
            100 * level;

          explosion(
            enemy.x,
            enemy.y,
            "#ff174f",
            30
          );

        }

        break;
      }

    }

  }


  playerShots =
    playerShots.filter(
      shot =>
        !shot.dead &&
        shot.y > -30
    );


  enemies =
    enemies.filter(
      enemy =>
        !enemy.dead
    );


  /* ENEMY SHOT COLLISIONS */

  for (const shot of enemyShots) {

    const distance =
      Math.hypot(
        shot.x - player.x,
        shot.y - player.y
      );

    if (distance < 32) {

      shot.dead = true;

      hurtPlayer(12);

    }

  }


  enemyShots =
    enemyShots.filter(
      shot =>
        !shot.dead &&
        shot.y < H + 40
    );


  /* PARTICLES */

  for (const p of particles) {

    p.x +=
      p.vx * dt;

    p.y +=
      p.vy * dt;

    p.vx *= .98;
    p.vy *= .98;

    p.life -= dt;

  }

  particles =
    particles.filter(
      p => p.life > 0
    );


  /* SHIELD RECHARGE */

  player.shield =
    Math.min(
      100,
      player.shield +
      dt * 4
    );


  /* NEXT LEVEL */

  if (
    enemies.length === 0 &&
    running
  ) {

    level++;

    player.hp =
      Math.min(
        100,
        player.hp + 15
      );

    player.shield =
      Math.min(
        100,
        player.shield + 30
      );

    createEnemies();

  }


  updateHUD();
}


/* =========================
   HUD
========================= */

function updateHUD() {

  document.getElementById(
    "level"
  ).textContent = level;

  document.getElementById(
    "enemyCount"
  ).textContent =
    enemies.length;

  document.getElementById(
    "score"
  ).textContent = score;

  document.getElementById(
    "health"
  ).style.width =
    player.hp + "%";

  document.getElementById(
    "shield"
  ).style.width =
    player.shield + "%";
}


/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground() {

  const gradient =
    ctx.createRadialGradient(
      W / 2,
      H / 2,
      0,
      W / 2,
      H / 2,
      Math.max(W, H)
    );

  gradient.addColorStop(
    0,
    "#10102d"
  );

  gradient.addColorStop(
    .5,
    "#05051a"
  );

  gradient.addColorStop(
    1,
    "#010108"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /* STARS */

  for (const star of stars) {

    star.y +=
      star.speed *
      .016;

    if (star.y > H) {
      star.y = 0;
    }

    ctx.globalAlpha =
      .3 +
      star.brightness *
      .7;

    ctx.fillStyle =
      "#ffffff";

    ctx.beginPath();

    ctx.arc(
      star.x,
      star.y,
      star.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }

  ctx.globalAlpha = 1;


  /* HORIZONTAL ENERGY LINES */

  ctx.strokeStyle =
    "rgba(80,80,180,.12)";

  ctx.lineWidth = 1;

  for (
    let y = 100;
    y < H;
    y += 100
  ) {

    ctx.beginPath();

    ctx.moveTo(0, y);
    ctx.lineTo(W, y);

    ctx.stroke();

  }

}


/* =========================
   PLAYER SHIP
========================= */

function drawPlayer() {

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  ctx.shadowBlur = 25;
  ctx.shadowColor =
    "#20aaff";

  /* wings */

  ctx.fillStyle =
    "#168ddd";

  ctx.beginPath();

  ctx.moveTo(0, -35);
  ctx.lineTo(-35, 27);
  ctx.lineTo(-8, 17);
  ctx.lineTo(0, 28);
  ctx.lineTo(8, 17);
  ctx.lineTo(35, 27);

  ctx.closePath();

  ctx.fill();


  /* cockpit */

  ctx.shadowBlur = 10;

  ctx.fillStyle =
    "#e9fbff";

  ctx.beginPath();

  ctx.moveTo(0, -22);
  ctx.lineTo(-9, 8);
  ctx.lineTo(9, 8);

  ctx.closePath();

  ctx.fill();


  /* engine */

  ctx.shadowBlur = 20;
  ctx.shadowColor =
    "#fff000";

  ctx.fillStyle =
    "#fff000";

  ctx.beginPath();

  ctx.moveTo(-9, 18);
  ctx.lineTo(0, 42);
  ctx.lineTo(9, 18);

  ctx.closePath();

  ctx.fill();

  ctx.restore();
}


/* =========================
   ENERGY ENEMY
========================= */

function drawEnemy(enemy) {

  ctx.save();

  ctx.translate(
    enemy.x,
    enemy.y
  );

  /*
    The enemy is designed as
    a sharp, glowing red/pink
    energy creature.
  */

  const pulse =
    1 +
    Math.sin(
      performance.now() *
      .006 +
      enemy.phase
    ) * .08;

  ctx.scale(
    pulse,
    pulse
  );


  /* OUTER GLOW */

  ctx.shadowBlur = 35;
  ctx.shadowColor =
    "#ff003c";


  /* MAIN SPIKY SHAPE */

  ctx.fillStyle =
    "#ff0648";

  ctx.beginPath();

  ctx.moveTo(0, -38);

  ctx.lineTo(8, -20);

  ctx.lineTo(22, -31);

  ctx.lineTo(18, -12);

  ctx.lineTo(38, -4);

  ctx.lineTo(19, 5);

  ctx.lineTo(31, 23);

  ctx.lineTo(11, 14);

  ctx.lineTo(5, 37);

  ctx.lineTo(-5, 16);

  ctx.lineTo(-28, 29);

  ctx.lineTo(-18, 8);

  ctx.lineTo(-39, 2);

  ctx.lineTo(-19, -8);

  ctx.lineTo(-26, -29);

  ctx.lineTo(-8, -19);

  ctx.closePath();

  ctx.fill();


  /* SECOND ENERGY LAYER */

  ctx.shadowBlur = 25;
  ctx.shadowColor =
    "#ff55a0";

  ctx.fillStyle =
    "#ff3974";

  ctx.beginPath();

  ctx.moveTo(0, -27);

  ctx.lineTo(13, -8);

  ctx.lineTo(28, 0);

  ctx.lineTo(12, 9);

  ctx.lineTo(0, 27);

  ctx.lineTo(-12, 9);

  ctx.lineTo(-28, 0);

  ctx.lineTo(-12, -9);

  ctx.closePath();

  ctx.fill();


  /* HOT WHITE CENTER */

  ctx.shadowBlur = 30;
  ctx.shadowColor =
    "#ffffff";

  ctx.fillStyle =
    "#fff4fa";

  ctx.beginPath();

  ctx.moveTo(0, -12);
  ctx.lineTo(9, 0);
  ctx.lineTo(0, 13);
  ctx.lineTo(-9, 0);

  ctx.closePath();

  ctx.fill();


  /* ENERGY LIGHTNING */

  ctx.strokeStyle =
    "#ffb7d0";

  ctx.lineWidth = 3;

  ctx.shadowBlur = 20;
  ctx.shadowColor =
    "#ff0055";

  ctx.beginPath();

  ctx.moveTo(-5, -34);
  ctx.lineTo(-13, -18);
  ctx.lineTo(-6, -13);
  ctx.lineTo(-19, 0);
  ctx.lineTo(-10, 0);
  ctx.lineTo(-18, 17);

  ctx.stroke();


  ctx.beginPath();

  ctx.moveTo(6, -34);
  ctx.lineTo(14, -18);
  ctx.lineTo(7, -12);
  ctx.lineTo(19, 0);
  ctx.lineTo(10, 1);
  ctx.lineTo(18, 18);

  ctx.stroke();


  /* ENERGY SPARKS */

  ctx.shadowBlur = 15;
  ctx.shadowColor =
    "#ff1660";

  ctx.fillStyle =
    "#ffffff";

  for (
    let i = 0;
    i < 6;
    i++
  ) {

    const angle =
      performance.now() *
      .002 +
      enemy.phase +
      i;

    const distance =
      35 +
      Math.sin(
        performance.now() *
        .005 +
        i
      ) * 8;

    const x =
      Math.cos(angle) *
      distance;

    const y =
      Math.sin(angle) *
      distance;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      1.7,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }


  ctx.restore();


  /* ENEMY HEALTH BAR */

  const barWidth = 55;

  ctx.fillStyle =
    "rgba(0,0,0,.6)";

  ctx.fillRect(
    enemy.x - barWidth / 2,
    enemy.y - 50,
    barWidth,
    5
  );

  ctx.fillStyle =
    "#ff174f";

  ctx.fillRect(
    enemy.x - barWidth / 2,
    enemy.y - 50,
    barWidth *
    enemy.hp /
    enemy.maxHp,
    5
  );

}


/* =========================
   BULLETS
========================= */

function drawBullets() {

  /* PLAYER */

  for (const shot of playerShots) {

    ctx.save();

    ctx.shadowBlur = 18;
    ctx.shadowColor =
      "#49d7ff";

    ctx.fillStyle =
      "#bdf5ff";

    ctx.fillRect(
      shot.x - 3,
      shot.y - 12,
      6,
      24
    );

    ctx.restore();

  }


  /* ENEMY ENERGY SHOTS */

  for (const shot of enemyShots) {

    ctx.save();

    ctx.shadowBlur = 25;
    ctx.shadowColor =
      "#ff0055";

    ctx.fillStyle =
      "#ff3c75";

    ctx.beginPath();

    ctx.arc(
      shot.x,
      shot.y,
      shot.radius,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.strokeStyle =
      "#ffb1ca";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
      shot.x,
      shot.y - 13
    );

    ctx.lineTo(
      shot.x,
      shot.y + 13
    );

    ctx.stroke();

    ctx.restore();

  }

}


/* =========================
   PARTICLES
========================= */

function drawParticles() {

  for (const p of particles) {

    ctx.globalAlpha =
      Math.max(
        0,
        p.life
      );

    ctx.fillStyle =
      p.color;

    ctx.shadowBlur = 15;
    ctx.shadowColor =
      p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
}


/* =========================
   DRAW
========================= */

function draw() {

  drawBackground();

  for (const enemy of enemies) {
    drawEnemy(enemy);
  }

  drawPlayer();

  drawBullets();

  drawParticles();

}


/* =========================
   GAME OVER
========================= */

function gameOver() {

  running = false;

  document.getElementById(
    "screen"
  ).classList.remove(
    "hidden"
  );

  document.getElementById(
    "card"
  ).innerHTML = `

    <h1>GAME OVER</h1>

    <p>Your ship was destroyed.</p>

    <p>Score: <b>${score}</b></p>

    <button onclick="startGame()">
      PLAY AGAIN
    </button>

  `;

}


/* =========================
   GAME LOOP
========================= */

function loop(time) {

  if (!running)
    return;

  const dt =
    Math.min(
      (time - lastTime) / 1000,
      .033
    );

  lastTime = time;

  update(dt);

  draw();

  requestAnimationFrame(loop);
}


/* =========================
   INITIALIZE
========================= */

resize();
createStars();
draw();

</script>

</body>
</html>
