<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Space Battle</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #010107;
  font-family: Arial, sans-serif;
  color: white;
}

#game {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: #010107;
}

#hud {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 5;
}

.box {
  background: rgba(2, 4, 18, .85);
  border: 1px solid #5264b8;
  border-radius: 12px;
  padding: 10px 15px;
  min-width: 175px;
  box-shadow: 0 0 18px rgba(80,100,255,.2);
}

.label {
  font-size: 12px;
  color: #aeb9e8;
}

.value {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 6px;
}

.bar {
  width: 150px;
  height: 8px;
  background: #171827;
  border-radius: 10px;
  overflow: hidden;
  margin: 3px 0 8px;
}

#health {
  height: 100%;
  width: 100%;
  background: #ff315c;
  box-shadow: 0 0 10px #ff315c;
}

#shield {
  height: 100%;
  width: 100%;
  background: #32aaff;
  box-shadow: 0 0 10px #32aaff;
}

#screen {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
  background: rgba(0,0,10,.4);
}

.card {
  text-align: center;
  padding: 35px;
  border-radius: 20px;
  background: rgba(3,5,20,.95);
  border: 1px solid #596ee0;
  box-shadow: 0 0 50px rgba(60,80,255,.35);
}

h1 {
  margin: 0 0 12px;
  font-size: 48px;
  letter-spacing: 5px;
  text-shadow:
    0 0 8px #fff,
    0 0 25px #4c7dff;
}

.card p {
  color: #cbd3ff;
  margin: 8px;
}

button {
  margin-top: 18px;
  padding: 13px 28px;
  border: 0;
  border-radius: 10px;
  background: #426aff;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 18px #426aff;
}

button:hover {
  background: #6c8cff;
  box-shadow: 0 0 30px #6c8cff;
}

.hidden {
  display: none !important;
}

#controls {
  position: absolute;
  bottom: 12px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #8995c5;
  font-size: 13px;
  pointer-events: none;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">

  <div class="box">

    <div class="label">LEVEL</div>
    <div class="value" id="level">1</div>

    <div class="label">ENEMIES</div>
    <div class="value" id="enemyCount">0</div>

    <div class="label">SCORE</div>
    <div class="value" id="score">0</div>

  </div>

  <div class="box">

    <div class="label">HULL</div>

    <div class="bar">
      <div id="health"></div>
    </div>

    <div class="label">SHIELD</div>

    <div class="bar">
      <div id="shield"></div>
    </div>

  </div>

</div>

<div id="screen">

  <div class="card" id="card">

    <h1>NEON SPACE BATTLE</h1>

    <p>Destroy all enemy ships.</p>

    <p><b>A / D</b> or <b>← / →</b> to move</p>

    <p><b>SPACE</b> to fire</p>

    <button id="start">START GAME</button>

  </div>

</div>

<div id="controls">
A / D or ← / → = Move &nbsp; | &nbsp; SPACE = Shoot
</div>

</div>

<script>

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

let W = 1200;
let H = 700;

let running = false;
let level = 1;
let score = 0;
let lastTime = 0;

const keys = {};

let enemies = [];
let playerShots = [];
let enemyShots = [];
let particles = [];
let stars = [];


/*
========================================
NEON COLORS
========================================
*/

const neonColors = [

  {
    main: "#ff174f",
    light: "#ff8aaa",
    glow: "#ff174f"
  },

  {
    main: "#ff6d00",
    light: "#ffb866",
    glow: "#ff6d00"
  },

  {
    main: "#ffee00",
    light: "#ffffaa",
    glow: "#ffee00"
  },

  {
    main: "#00ff66",
    light: "#9affc5",
    glow: "#00ff66"
  },

  {
    main: "#00eaff",
    light: "#a8f8ff",
    glow: "#00eaff"
  },

  {
    main: "#1677ff",
    light: "#9ac8ff",
    glow: "#1677ff"
  },

  {
    main: "#9b30ff",
    light: "#d59cff",
    glow: "#9b30ff"
  },

  {
    main: "#ff22cc",
    light: "#ff9aeb",
    glow: "#ff22cc"
  }

];


const player = {

  x: 600,
  y: 620,

  speed: 450,

  hp: 100,
  shield: 100,

  cooldown: 0

};


/*
========================================
RESIZE
========================================
*/

function resize() {

  W =
    canvas.width =
    window.innerWidth;

  H =
    canvas.height =
    window.innerHeight;

  player.y =
    H - 100;

  player.x =
    Math.max(
      35,
      Math.min(
        W - 35,
        player.x
      )
    );

}

window.addEventListener(
  "resize",
  resize
);


/*
========================================
STARS
========================================
*/

function createStars() {

  stars = [];

  for (
    let i = 0;
    i < 200;
    i++
  ) {

    stars.push({

      x:
        Math.random() * W,

      y:
        Math.random() * H,

      size:
        Math.random() * 2 + .3,

      speed:
        Math.random() * 35 + 10,

      brightness:
        Math.random()

    });

  }

}


/*
========================================
CREATE ENEMIES
========================================
*/

function createEnemies() {

  enemies = [];

  const count =
    Math.min(
      4 + level * 2,
      24
    );

  const columns =
    Math.min(
      6,
      count
    );

  const spacing =
    Math.min(
      145,
      W / (columns + 1)
    );


  for (
    let i = 0;
    i < count;
    i++
  ) {

    const column =
      i % columns;

    const row =
      Math.floor(
        i / columns
      );

    const baseX =
      W / 2 +
      (
        column -
        (columns - 1) / 2
      ) *
      spacing;

    const baseY =
      120 +
      row * 85;


    const hp =
      2 +
      Math.floor(
        level / 3
      );


    const color =
      neonColors[
        i % neonColors.length
      ];


    enemies.push({

      x: baseX,

      baseX: baseX,

      y: baseY,

      hp: hp,

      maxHp: hp,

      color: color,

      phase:
        Math.random() *
        Math.PI * 2,

      movementSpeed:
        .7 +
        Math.random() * .5,

      movementWidth:
        Math.min(
          130 + level * 5,
          W * .2
        ),

      shootTimer:
        Math.random() * 2,

      shootRate:
        Math.max(
          .45,
          1.5 -
          level * .05
        )

    });

  }

}


/*
========================================
START GAME
========================================
*/

function startGame() {

  resize();

  level = 1;

  score = 0;

  player.hp = 100;

  player.shield = 100;

  player.x =
    W / 2;

  playerShots = [];

  enemyShots = [];

  particles = [];

  createStars();

  createEnemies();

  document
    .getElementById("screen")
    .classList
    .add("hidden");

  running = true;

  lastTime =
    performance.now();

  requestAnimationFrame(
    loop
  );

}


document
  .getElementById("start")
  .onclick =
  startGame;


/*
========================================
KEYBOARD
========================================
*/

window.addEventListener(
  "keydown",
  e => {

    keys[
      e.key.toLowerCase()
    ] = true;


    if (
      e.code === "Space"
    ) {

      keys.space = true;

      e.preventDefault();

    }


    if (
      e.key === "ArrowLeft" ||
      e.key === "ArrowRight"
    ) {

      e.preventDefault();

    }

  }
);


window.addEventListener(
  "keyup",
  e => {

    keys[
      e.key.toLowerCase()
    ] = false;


    if (
      e.code === "Space"
    ) {

      keys.space = false;

    }

  }
);


/*
========================================
PLAYER SHOOT
========================================
*/

function playerShoot() {

  if (
    player.cooldown > 0
  )
    return;


  playerShots.push({

    x:
      player.x,

    y:
      player.y - 30,

    speed:
      700,

    radius:
      4

  });


  player.cooldown =
    .16;

}


/*
========================================
ENEMY SHOOT
========================================
*/

function enemyShoot(enemy) {

  enemyShots.push({

    x:
      enemy.x,

    y:
      enemy.y + 28,

    speed:
      250 +
      level * 15,

    radius:
      6,

    color:
      enemy.color

  });

}


/*
========================================
PLAYER DAMAGE
========================================
*/

function hurtPlayer(
  amount
) {

  if (
    player.shield > 0
  ) {

    const absorbed =
      Math.min(
        player.shield,
        amount
      );

    player.shield -=
      absorbed;

    amount -=
      absorbed;

  }


  player.hp -=
    amount;


  explosion(
    player.x,
    player.y,
    "#00eaff",
    8
  );


  if (
    player.hp <= 0
  ) {

    player.hp = 0;

    gameOver();

  }

}


/*
========================================
EXPLOSION
========================================
*/

function explosion(
  x,
  y,
  color,
  amount
) {

  for (
    let i = 0;
    i < amount;
    i++
  ) {

    const angle =
      Math.random() *
      Math.PI * 2;

    const speed =
      Math.random() *
      220 +
      40;


    particles.push({

      x: x,

      y: y,

      vx:
        Math.cos(angle) *
        speed,

      vy:
        Math.sin(angle) *
        speed,

      life:
        .3 +
        Math.random() *
        .6,

      size:
        Math.random() *
        4 +
        1,

      color:
        color

    });

  }

}


/*
========================================
UPDATE
========================================
*/

function update(dt) {


  /*
  PLAYER MOVEMENT
  */

  let direction = 0;


  if (
    keys["a"] ||
    keys["arrowleft"]
  ) {

    direction--;

  }


  if (
    keys["d"] ||
    keys["arrowright"]
  ) {

    direction++;

  }


  player.x +=
    direction *
    player.speed *
    dt;


  player.x =
    Math.max(
      35,
      Math.min(
        W - 35,
        player.x
      )
    );


  /*
  SHOOT
  */

  if (
    keys.space
  ) {

    playerShoot();

  }


  player.cooldown =
    Math.max(
      0,
      player.cooldown -
      dt
    );


  /*
  ENEMIES
  */

  for (
    const enemy of enemies
  ) {


    enemy.x =
      enemy.baseX +
      Math.sin(
        performance.now() *
        .001 *
        enemy.movementSpeed +
        enemy.phase
      ) *
      enemy.movementWidth;


    enemy.x =
      Math.max(
        35,
        Math.min(
          W - 35,
          enemy.x
        )
      );


    enemy.shootTimer -=
      dt;


    if (
      enemy.shootTimer <= 0
    ) {

      enemyShoot(
        enemy
      );

      enemy.shootTimer =
        enemy.shootRate +
        Math.random() *
        .7;

    }

  }


  /*
  PLAYER SHOTS
  */

  for (
    const shot of playerShots
  ) {

    shot.y -=
      shot.speed * dt;

  }


  /*
  ENEMY SHOTS
  */

  for (
    const shot of enemyShots
  ) {

    shot.y +=
      shot.speed * dt;

  }


  /*
  PLAYER BULLETS HIT ENEMIES
  */

  for (
    const shot of playerShots
  ) {

    for (
      const enemy of enemies
    ) {

      if (
        enemy.dead
      )
        continue;


      const distance =
        Math.hypot(
          shot.x -
          enemy.x,

          shot.y -
          enemy.y
        );


      if (
        distance < 35
      ) {

        shot.dead =
          true;


        enemy.hp--;


        explosion(
          shot.x,
          shot.y,
          enemy.color.main,
          6
        );


        if (
          enemy.hp <= 0
        ) {

          enemy.dead =
            true;


          score +=
            100 * level;


          explosion(
            enemy.x,
            enemy.y,
            enemy.color.main,
            35
          );

        }


        break;

      }

    }

  }


  playerShots =
    playerShots.filter(
      shot =>
        !shot.dead &&
        shot.y > -30
    );


  enemies =
    enemies.filter(
      enemy =>
        !enemy.dead
    );


  /*
  ENEMY SHOTS HIT PLAYER
  */

  for (
    const shot of enemyShots
  ) {

    const distance =
      Math.hypot(
        shot.x -
        player.x,

        shot.y -
        player.y
      );


    if (
      distance < 34
    ) {

      shot.dead =
        true;

      hurtPlayer(
        12
      );

    }

  }


  enemyShots =
    enemyShots.filter(
      shot =>
        !shot.dead &&
        shot.y <
        H + 40
    );


  /*
  PARTICLES
  */

  for (
    const p of particles
  ) {

    p.x +=
      p.vx * dt;

    p.y +=
      p.vy * dt;

    p.vx *=
      .98;

    p.vy *=
      .98;

    p.life -=
      dt;

  }


  particles =
    particles.filter(
      p =>
        p.life > 0
    );


  /*
  SHIELD RECHARGE
  */

  player.shield =
    Math.min(
      100,
      player.shield +
      dt * 4
    );


  /*
  NEXT LEVEL
  */

  if (
    enemies.length === 0 &&
    running
  ) {

    level++;


    player.hp =
      Math.min(
        100,
        player.hp + 15
      );


    player.shield =
      Math.min(
        100,
        player.shield + 30
      );


    createEnemies();

  }


  updateHUD();

}


/*
========================================
HUD
========================================
*/

function updateHUD() {

  document
    .getElementById("level")
    .textContent =
    level;


  document
    .getElementById("enemyCount")
    .textContent =
    enemies.length;


  document
    .getElementById("score")
    .textContent =
    score;


  document
    .getElementById("health")
    .style.width =
    player.hp +
    "%";


  document
    .getElementById("shield")
    .style.width =
    player.shield +
    "%";

}


/*
========================================
BACKGROUND
========================================
*/

function drawBackground() {

  const gradient =
    ctx.createRadialGradient(
      W / 2,
      H / 2,
      0,
      W / 2,
      H / 2,
      Math.max(W, H)
    );


  gradient.addColorStop(
    0,
    "#111136"
  );


  gradient.addColorStop(
    .5,
    "#05051b"
  );


  gradient.addColorStop(
    1,
    "#010107"
  );


  ctx.fillStyle =
    gradient;


  ctx.fillRect(
    0,
    0,
    W,
    H
  );


  /*
  STARS
  */

  for (
    const star of stars
  ) {

    star.y +=
      star.speed *
      .016;


    if (
      star.y > H
    ) {

      star.y = 0;

    }


    ctx.globalAlpha =
      .3 +
      star.brightness *
      .7;


    ctx.fillStyle =
      "#ffffff";


    ctx.beginPath();


    ctx.arc(
      star.x,
      star.y,
      star.size,
      0,
      Math.PI * 2
    );


    ctx.fill();

  }


  ctx.globalAlpha =
    1;


  /*
  LEVEL LINES
  */

  ctx.strokeStyle =
    "rgba(100,100,220,.13)";


  for (
    let y = 100;
    y < H;
    y += 100
  ) {

    ctx.beginPath();

    ctx.moveTo(
      0,
      y
    );

    ctx.lineTo(
      W,
      y
    );

    ctx.stroke();

  }

}


/*
========================================
PLAYER
========================================
*/

function drawPlayer() {

  ctx.save();


  ctx.translate(
    player.x,
    player.y
  );


  ctx.shadowBlur =
    28;


  ctx.shadowColor =
    "#00c8ff";


  /*
  WINGS
  */

  ctx.fillStyle =
    "#087dcc";


  ctx.beginPath();


  ctx.moveTo(
    0,
    -35
  );


  ctx.lineTo(
    -35,
    27
  );


  ctx.lineTo(
    -8,
    17
  );


  ctx.lineTo(
    0,
    28
  );


  ctx.lineTo(
    8,
    17
  );


  ctx.lineTo(
    35,
    27
  );


  ctx.closePath();


  ctx.fill();


  /*
  COCKPIT
  */

  ctx.shadowBlur =
    12;


  ctx.fillStyle =
    "#eaffff";


  ctx.beginPath();


  ctx.moveTo(
    0,
    -22
  );


  ctx.lineTo(
    -9,
    8
  );


  ctx.lineTo(
    9,
    8
  );


  ctx.closePath();


  ctx.fill();


  /*
  ENGINE
  */

  ctx.shadowBlur =
    25;


  ctx.shadowColor =
    "#ffff00";


  ctx.fillStyle =
    "#ffff00";


  ctx.beginPath();


  ctx.moveTo(
    -9,
    18
  );


  ctx.lineTo(
    0,
    43
  );


  ctx.lineTo(
    9,
    18
  );


  ctx.closePath();


  ctx.fill();


  ctx.restore();

}


/*
========================================
NEON ENEMY
========================================
*/

function drawEnemy(
  enemy
) {

  const c =
    enemy.color;


  ctx.save();


  ctx.translate(
    enemy.x,
    enemy.y
  );


  /*
  PULSING SCALE
  */

  const pulse =
    1 +
    Math.sin(
      performance.now() *
      .006 +
      enemy.phase
    ) *
    .08;


  ctx.scale(
    pulse,
    pulse
  );


  /*
  OUTER NEON GLOW
  */

  ctx.shadowBlur =
    40;


  ctx.shadowColor =
    c.glow;


  /*
  MAIN SPIKY BODY
  */

  ctx.fillStyle =
    c.main;


  ctx.beginPath();


  ctx.moveTo(
    0,
    -40
  );


  ctx.lineTo(
    9,
    -21
  );


  ctx.lineTo(
    24,
    -33
  );


  ctx.lineTo(
    19,
    -12
  );


  ctx.lineTo(
    40,
    -4
  );


  ctx.lineTo(
    20,
    6
  );


  ctx.lineTo(
    32,
    24
  );


  ctx.lineTo(
    11,
    15
  );


  ctx.lineTo(
    5,
    39
  );


  ctx.lineTo(
    -5,
    17
  );


  ctx.lineTo(
    -29,
    30
  );


  ctx.lineTo(
    -18,
    8
  );


  ctx.lineTo(
    -40,
    2
  );


  ctx.lineTo(
    -19,
    -8
  );


  ctx.lineTo(
    -27,
    -30
  );


  ctx.lineTo(
    -8,
    -20
  );


  ctx.closePath();


  ctx.fill();


  /*
  SECOND NEON LAYER
  */

  ctx.shadowBlur =
    25;


  ctx.shadowColor =
    c.light;


  ctx.fillStyle =
    c.light;


  ctx.globalAlpha =
    .65;


  ctx.beginPath();


  ctx.moveTo(
    0,
    -28
  );


  ctx.lineTo(
    13,
    -8
  );


  ctx.lineTo(
    29,
    0
  );


  ctx.lineTo(
    12,
    9
  );


  ctx.lineTo(
    0,
    28
  );


  ctx.lineTo(
    -12,
    9
  );


  ctx.lineTo(
    -29,
    0
  );


  ctx.lineTo(
    -12,
    -9
  );


  ctx.closePath();


  ctx.fill();


  ctx.globalAlpha =
    1;


  /*
  WHITE HOT CORE
  */

  ctx.shadowBlur =
    35;


  ctx.shadowColor =
    "#ffffff";


  ctx.fillStyle =
    "#ffffff";


  ctx.beginPath();


  ctx.moveTo(
    0,
    -12
  );


  ctx.lineTo(
    9,
    0
  );


  ctx.lineTo(
    0,
    13
  );


  ctx.lineTo(
    -9,
    0
  );


  ctx.closePath();


  ctx.fill();


  /*
  LEFT ENERGY BOLT
  */

  ctx.strokeStyle =
    c.light;


  ctx.lineWidth =
    3;


  ctx.shadowBlur =
    22;


  ctx.shadowColor =
    c.glow;


  ctx.beginPath();


  ctx.moveTo(
    -5,
    -35
  );


  ctx.lineTo(
    -14,
    -18
  );


  ctx.lineTo(
    -6,
    -13
  );


  ctx.lineTo(
    -20,
    0
  );


  ctx.lineTo(
    -10,
    0
  );


  ctx.lineTo(
    -19,
    18
  );


  ctx.stroke();


  /*
  RIGHT ENERGY BOLT
  */

  ctx.beginPath();


  ctx.moveTo(
    6,
    -35
  );


  ctx.lineTo(
    14,
    -18
  );


  ctx.lineTo(
    7,
    -12
  );


  ctx.lineTo(
    20,
    0
  );


  ctx.lineTo(
    10,
    1
  );


  ctx.lineTo(
    19,
    18
  );


  ctx.stroke();


  /*
  NEON SPARKS
  */

  ctx.fillStyle =
    "#ffffff";


  ctx.shadowBlur =
    18;


  ctx.shadowColor =
    c.glow;


  for (
    let i = 0;
    i < 7;
    i++
  ) {

    const angle =
      performance.now() *
      .002 +
      enemy.phase +
      i;


    const distance =
      38 +
      Math.sin(
        performance.now() *
        .005 +
        i
      ) *
      9;


    const sx =
      Math.cos(angle) *
      distance;


    const sy =
      Math.sin(angle) *
      distance;


    ctx.beginPath();


    ctx.arc(
      sx,
      sy,
      1.8,
      0,
      Math.PI * 2
    );


    ctx.fill();

  }


  ctx.restore();


  /*
  HEALTH BAR
  */

  const barWidth =
    58;


  ctx.fillStyle =
    "rgba(0,0,0,.65)";


  ctx.fillRect(
    enemy.x -
    barWidth / 2,

    enemy.y -
    53,

    barWidth,
    5
  );


  ctx.fillStyle =
    c.main;


  ctx.shadowBlur =
    10;


  ctx.shadowColor =
    c.glow;


  ctx.fillRect(
    enemy.x -
    barWidth / 2,

    enemy.y -
    53,

    barWidth *
    enemy.hp /
    enemy.maxHp,

    5
  );


  ctx.shadowBlur =
    0;

}


/*
========================================
BULLETS
========================================
*/

function drawBullets() {


  /*
  PLAYER LASER
  */

  for (
    const shot of playerShots
  ) {

    ctx.save();


    ctx.shadowBlur =
      22;


    ctx.shadowColor =
      "#00eaff";


    ctx.fillStyle =
      "#d9ffff";


    ctx.fillRect(
      shot.x - 3,
      shot.y - 13,
      6,
      26
    );


    ctx.restore();

  }


  /*
  NEON ENEMY ENERGY SHOTS
  */

  for (
    const shot of enemyShots
  ) {

    const c =
      shot.color;


    ctx.save();


    ctx.shadowBlur =
      30;


    ctx.shadowColor =
      c.glow;


    ctx.fillStyle =
      c.main;


    ctx.beginPath();


    ctx.arc(
      shot.x,
      shot.y,
      shot.radius,
      0,
      Math.PI * 2
    );


    ctx.fill();


    /*
    ENERGY TRAIL
    */

    ctx.strokeStyle =
      c.light;


    ctx.lineWidth =
      3;


    ctx.beginPath();


    ctx.moveTo(
      shot.x,
      shot.y - 18
    );


    ctx.lineTo(
      shot.x,
      shot.y + 18
    );


    ctx.stroke();


    ctx.restore();

  }

}


/*
========================================
PARTICLES
========================================
*/

function drawParticles() {

  for (
    const p of particles
  ) {

    ctx.globalAlpha =
      Math.max(
        0,
        p.life
      );


    ctx.fillStyle =
      p.color;


    ctx.shadowBlur =
      18;


    ctx.shadowColor =
      p.color;


    ctx.beginPath();


    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );


    ctx.fill();

  }


  ctx.globalAlpha =
    1;


  ctx.shadowBlur =
    0;

}


/*
========================================
DRAW
========================================
*/

function draw() {

  drawBackground();


  for (
    const enemy of enemies
  ) {

    drawEnemy(
      enemy
    );

  }


  drawPlayer();

  drawBullets();

  drawParticles();

}


/*
========================================
GAME OVER
========================================
*/

function gameOver() {

  running =
    false;


  document
    .getElementById("screen")
    .classList
    .remove("hidden");


  document
    .getElementById("card")
    .innerHTML = `

      <h1>GAME OVER</h1>

      <p>Your ship was destroyed.</p>

      <p>
        Score:
        <b>${score}</b>
      </p>

      <button
        onclick="startGame()"
      >
        PLAY AGAIN
      </button>

    `;

}


/*
========================================
GAME LOOP
========================================
*/

function loop(time) {

  if (
    !running
  )
    return;


  const dt =
    Math.min(
      (time -
       lastTime) /
      1000,

      .033
    );


  lastTime =
    time;


  update(dt);

  draw();


  requestAnimationFrame(
    loop
  );

}


/*
========================================
INITIALIZE
========================================
*/

resize();

createStars();

draw();

</script>

</body>
</html>
